<div class="visualization-studio"
     data-course-id="{course_id}"
     data-block-id="{block_id}"
     data-sequential-id="{sequential_id}"
     data-applied-prompt="{applied_prompt}"
     data-generated-at="{generated_at}">
  <div class="visualization-field">
    <label for="visualization-display-name">Display name</label>
    <input id="visualization-display-name" type="text" value="{display_name}" />
  </div>

  <section class="visualization-assistant" aria-label="AI Content Assistant">
    <header class="visualization-assistant-header">
      <h3>AI Content Assistant</h3>
      <div class="visualization-assistant-meta">
        <span class="visualization-message-count" aria-live="polite">0 message(s)</span>
        <button type="button" class="visualization-clear-history">Clear History</button>
      </div>
    </header>

    <div class="visualization-messages" role="log" aria-live="polite"></div>

    <form class="visualization-compose" aria-label="Send message">
      <textarea class="visualization-prompt"
                rows="3"
                placeholder="Describe the simulation you want…"></textarea>
      <button type="submit" class="visualization-send">Send</button>
    </form>
    <p class="visualization-hint">Press Enter to send, Shift+Enter for a new line.</p>
  </section>

  <div class="visualization-error" role="alert" style="display:none">
    <strong>Last error:</strong> <span class="visualization-error-msg"></span>
  </div>

  <div class="visualization-preview-wrap" style="display:{preview_display}">
    <div class="visualization-preview-header">
      <h4>Applied simulation</h4>
      <small class="visualization-generated-at">{generated_at}</small>
    </div>
    <iframe class="visualization-preview"
            sandbox="allow-scripts"
            srcdoc="{preview_srcdoc}"
            style="width:100%;height:600px;border:1px solid #ccc"
            title="Applied simulation"></iframe>
  </div>

  <div class="visualization-actions">
    <button type="button" class="visualization-save">Save settings</button>
    <span class="visualization-status" data-status="idle">Status: idle</span>
  </div>
</div>
