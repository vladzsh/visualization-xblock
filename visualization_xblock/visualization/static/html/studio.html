<div class="visualization-studio">
  <h3>Visualization — Interactive Simulation</h3>

  <div class="visualization-field">
    <label for="visualization-display-name">Display name</label>
    <input id="visualization-display-name" type="text" value="{display_name}" />
  </div>

  <div class="visualization-field">
    <label for="visualization-prompt">Simulation prompt</label>
    <textarea id="visualization-prompt" rows="8" placeholder="Create an interactive simulation of ...">{prompt}</textarea>
  </div>

  <div class="visualization-field">
    <label for="visualization-model">Gemini model</label>
    <select id="visualization-model">
      {model_options}
    </select>
    <p class="visualization-hint">gemini-2.5-flash — free tier. gemini-2.5-pro — requires billing. gemini-3.1-pro — WebGL/3D.</p>
  </div>

  <div class="visualization-actions">
    <button type="button" class="visualization-save">Save</button>
    <button type="button" class="visualization-generate">Generate simulation</button>
    <span class="visualization-status" data-status="{status}">Status: {status}</span>
  </div>

  <div class="visualization-error" style="display:{error_display}">
    <strong>Last error:</strong> <span class="visualization-error-msg">{last_error}</span>
  </div>

  <div class="visualization-preview-wrap" style="display:{preview_display}">
    <h4>Preview <small class="visualization-generated-at">{generated_at}</small></h4>
    <iframe class="visualization-preview"
            sandbox="allow-scripts"
            srcdoc="{preview_srcdoc}"
            style="width:100%;min-height:600px;border:1px solid #ccc;display:block"
            title="Simulation preview"></iframe>
  </div>
</div>
